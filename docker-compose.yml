version: '3'
services:
  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testlab01
      POSTGRES_DB: nyt_covid19
    ports:
      - "5432:5432" # Map Postgres port to the host
    networks:
      - spark_network

  etl-master:
    container_name: etl-master
    image: distributed-etl-app/etl-master:development
    depends_on:
      - postgres
    ports:
      - 7077:7077
      - 8080:8080
    networks:
      - spark_network

  etl-worker-1:
    container_name: etl-worker-1
    image: distributed-etl-app/etl-worker:development
    depends_on:
      - postgres
      - etl-master
    env_file:
      - ./etl-worker/.env
    networks:
      - spark_network
    command: spark-class org.apache.spark.deploy.worker.Worker spark://etl-master:7077
    volumes:
      - ${PWD}/etl-worker/src/app:/app
      - ${PWD}/reports:/tmp/reports

  etl-worker-2:
    container_name: etl-worker-2
    image: distributed-etl-app/etl-worker:development
    depends_on:
      - postgres
      - etl-master
    env_file:
      - ./etl-worker/.env
    networks:
      - spark_network
    command: spark-class org.apache.spark.deploy.worker.Worker spark://etl-master:7077
    volumes:
      - ${PWD}/etl-worker/src/app:/app
      - ${PWD}/reports:/tmp/reports

networks:
  spark_network: